# ==============================================================================
# Chatterbox Release Workflow (npm Trusted Publishing / OIDC)
# ==============================================================================
# IMPORTANT RELEASE SAFEGUARDS:
# 1. This workflow MUST NEVER run automatically on ordinary branch pushes or PRs.
# 2. Triggering requires an explicit GitHub Release publication or manual dispatch.
# 3. Before this workflow can succeed, npm Trusted Publisher MUST be configured on
#    npmjs.com under Package Settings -> Publishing Access -> Trusted Publishers.
# 4. Settings must match:
#    - Owner / Organization: MelkiZedekICT
#    - Repository: chatterbox-cli
#    - Workflow filename: release.yml
# 5. Provenance is generated cryptographically via GitHub Actions OIDC (id-token: write).
#    No long-lived NPM_TOKEN secret is used or permitted.
# ==============================================================================

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate-and-publish:
    name: Verify & Publish (OIDC Provenance)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification checks (Typecheck, Lint, Test, Build, Install Gate)
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          node scripts/check-install-perf.mjs

      - name: Dry-run package archive verification
        run: npm pack --dry-run

      # The actual publication step uses OIDC trusted publishing with provenance.
      # Note: This will execute only when a maintainer explicitly creates a release on GitHub.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
